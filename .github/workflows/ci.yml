name: SkyGuard Continuous Integration & Security Auditing

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend-unit-and-security:
    name: Backend Pytest, Security & Stress Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run offline test suite
        env:
          PYTHONPATH: .
        run: |
          pytest services/api/tests/ -v -m "not live"

      - name: Run production security and geospatial tests
        env:
          PYTHONPATH: .
        run: |
          pytest services/api/tests/test_production_security_geo.py -v

      - name: Run concurrency and stress hardening tests
        env:
          PYTHONPATH: .
        run: |
          pytest services/api/tests/test_stress_and_hardening.py -v

  backend-dependency-audit:
    name: Backend Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit backend requirements against PyPI/OSV vulnerabilities
        run: |
          pip-audit -r services/api/requirements.txt

  frontend-typescript-check:
    name: Frontend Strict TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict TypeScript compile check
        run: pnpm --filter web exec tsc --noEmit

  frontend-production-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js App
        run: pnpm --filter web build

  e2e-playwright-verification:
    name: Headless Playwright E2E Multi-Suite Verification
    runs-on: ubuntu-latest
    needs: [backend-unit-and-security, frontend-production-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install backend and playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Install frontend dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build

      - name: Start FastAPI backend daemon
        run: |
          PYTHONPATH=. uvicorn services.api.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          READY=0
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI backend is ready!"
              READY=1
              break
            fi
            echo "Waiting for FastAPI backend to respond ($i/30)..."
            sleep 1
          done
          if [ $READY -eq 0 ]; then
            echo "FastAPI backend failed to become ready within 30 seconds. Server logs:"
            cat backend.log
            exit 1
          fi

      - name: Start Next.js frontend daemon
        run: |
          pnpm --filter web start -p 3000 > frontend.log 2>&1 &
          READY=0
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Next.js frontend is ready!"
              READY=1
              break
            fi
            echo "Waiting for Next.js frontend to respond ($i/30)..."
            sleep 1
          done
          if [ $READY -eq 0 ]; then
            echo "Next.js frontend failed to become ready within 30 seconds. Server logs:"
            cat frontend.log
            exit 1
          fi

      - name: Run 5 Playwright E2E Test Suites
        run: |
          PYTHONPATH=. python -u tests/test_browser_e2e.py
